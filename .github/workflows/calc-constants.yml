name: 세법 상수 대조 (월간)

# fin_calc는 세율·한도·배수를 코드 상수로 들고 계산한다. 세법이 바뀌었는데 상수가 그대로면
# 오류 없이 틀린 금액이 확신형으로 나간다. 매월 조문 원문을 받아 상수와 대조한다
# (test/calc-constants-live.test.ts). 푸시마다 돌리는 CI(ci.yml)와 분리한 이유: 외부 API 장애가
# 곧 빌드 실패가 되면 잡음이 된다 — 여기서는 월 1회, 실패하면 "대조를 못 했다"도 실패로 본다.
#
# 필요: 저장소 시크릿 LAW_OC (법제처 OPEN API 인증키). 없으면 첫 단계에서 이유를 적고 실패한다.
on:
  schedule:
    # 매월 2일 09:00 KST — 1월 1일 정기 개정 다음 날에도 한 번 돈다
    - cron: "0 0 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calc-constants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: LAW_OC 시크릿 확인
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          if [ -z "$LAW_OC" ]; then
            echo "::error::저장소 시크릿 LAW_OC가 없습니다 — Settings > Secrets and variables > Actions에 법제처 인증키를 등록하세요"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # ⚠ --omit=optional 금지 — TS 7 컴파일러가 optionalDependencies다 (ci.yml 주석 참고)
      - run: npm ci

      # FIN_LIVE_STRICT=1: 조회 실패를 skip(초록불)이 아니라 실패로 올린다 — 무인 실행에서
      # "대조하지 못했다"가 통과로 묻히지 않게. 실패 메시지가 "[조회 실패 — 상수 문제 아님]"이면
      # 법제처 장애·한도 문제이고, "[상수 갱신 신호]"면 조문이 바뀐 것이다
      - name: 상수 원문 대조
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          FIN_LIVE_STRICT: "1"
        run: npx vitest run --config vitest.live.config.ts test/calc-constants-live.test.ts
