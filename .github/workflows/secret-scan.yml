name: Secret scan

# 법제처 API 키(LAW_OC)가 커밋에 섞여 들어가는 것을 막는다.
# .env는 gitignore이지만, 스크래치 스크립트나 문서에 키를 붙여 넣는 실수가 실제 위험이다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: LAW_OC 하드코딩 검사
        run: |
          # LAW_OC에 실제 값이 대입된 형태만 잡는다.
          # URL의 ?OC= 패턴은 마스킹 테스트(OC=secret123 → OC=***)가 정당하게 쓰므로 대상이 아니다.
          # 자리표시자(<...>, YOUR_, 발급, example)와 process.env 참조는 통과시킨다.
          hits=$(grep -rInE '(LAW_OC|KOREAN_LAW_API_KEY)[[:space:]]*[:=][[:space:]]*"?[A-Za-z0-9]{3,}' \
                   --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build . \
                 | grep -vE '(process\.env|env\.|<[^>]+>|YOUR_|발급|예:|example|\.env\.example|\$\{)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::API 키로 보이는 값이 저장소에 있습니다 — .env로 옮기세요"
            exit 1
          fi
          echo "하드코딩된 API 키 없음"
