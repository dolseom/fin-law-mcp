name: 오검증 제보 (인용 판정이 틀렸습니다)
description: fin_verify가 맞는 인용에 ✗·⚠를 주거나, 틀린 인용에 ✓를 준 사례를 제보합니다
title: "[오검증] "
labels: ["오검증", "verify"]
body:
  - type: markdown
    attributes:
      value: |
        **틀린 인용에 ✓를 주는 것(거짓 음성)이 가장 심각한 결함입니다.** 실무자가 존재하지 않는 근거를 그대로 씁니다.
        맞는 인용에 ✗를 주는 것(거짓 양성)도 결함입니다 — 실무자가 맞는 근거를 지웁니다.

        재현 텍스트만 있으면 회귀 테스트로 박제할 수 있습니다. 개인정보·고객 정보는 반드시 지우고 올려주세요.

  - type: textarea
    id: text
    attributes:
      label: 재현 텍스트
      description: fin_verify에 넣은 원문 그대로 붙여넣어 주세요 (문장 단위면 충분합니다)
      placeholder: "법인세법 제26조 및 같은 법 시행령 제43조에 따라 손금불산입한다."
    validations:
      required: true

  - type: dropdown
    id: expected
    attributes:
      label: 기대한 판정
      options:
        - "✓ 있음 (실존하는 인용입니다)"
        - "✗ 없음 (실존하지 않는 인용입니다)"
        - "⚠ 판정 불가 (단정할 근거가 없습니다)"
    validations:
      required: true

  - type: dropdown
    id: actual
    attributes:
      label: 실제 판정
      options:
        - "✓ 있음"
        - "✗ 없음"
        - "⚠ 판정 불가"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: fin_verify 출력 전문
      description: 판정 라인을 그대로 붙여넣어 주세요 (어떤 사유로 그 판정이 났는지가 원인 추적의 출발점입니다)
      placeholder: "[기준: 현행] 인용 검증 — 2건: ✓1 / ✗1 / ⚠0\n✓ 법인세법 제26조 — …\n✗ 같은 법 시행령 제43조 — …"
      render: text
    validations:
      required: true

  - type: input
    id: basis_date
    attributes:
      label: 기준일 (basis_date)
      description: 과거 시점으로 검증했다면 그 날짜 (YYYY-MM-DD). 현행 기준이면 비워 두세요
      placeholder: "2020-01-01"

  - type: textarea
    id: evidence
    attributes:
      label: 근거 (선택)
      description: 국가법령정보센터 링크나 조문 제목 등 "맞다/틀리다"를 확인할 수 있는 자료
      placeholder: "https://www.law.go.kr/법령/법인세법/제26조"

  - type: input
    id: version
    attributes:
      label: 버전
      description: package.json의 version 또는 커밋 해시
      placeholder: "0.1.0"
