name: 이 질문을 했는데 도움이 안 됐어요
description: 실무 질문에 필요한 근거가 안 나오거나, 엉뚱한 조문·예규가 나온 경우를 제보합니다
title: "[실사용] "
labels: ["실사용", "search"]
body:
  - type: markdown
    attributes:
      value: |
        **"검색은 됐는데 쓸 게 없었다"가 가장 중요한 제보입니다.** 오류가 아니라서 테스트에 안 걸리고,
        실무자만 압니다. 도구가 0건을 주면 실무자는 "그런 근거가 없다"로 읽게 되는데, 대개는
        검색어·별칭·검색 범위 문제입니다.

        개발 지식은 필요 없습니다. **질문 원문과 받은 답만 있으면 충분합니다.**
        개인정보·고객사 정보·금액은 반드시 지우고 올려주세요.

  - type: textarea
    id: question
    attributes:
      label: 어떤 질문을 하셨나요
      description: AI에게 물어본 말 그대로 붙여넣어 주세요
      placeholder: "직원 결혼 축의금을 회사 돈으로 주면 세금 문제 있나?"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 무엇이 나왔어야 했나요
      description: 기대한 조문·예규·판단 근거. "이 조문이 나왔어야 한다" 정도면 충분합니다
      placeholder: "법인세법 시행령 제45조 제1항 제8호(사회통념상 타당한 경조사비)가 나왔어야 합니다"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제로 받은 응답
      description: 도구 출력을 그대로 붙여넣어 주세요 (AI가 정리한 답이 아니라 도구 출력이면 원인 추적이 훨씬 빠릅니다)
      render: text
    validations:
      required: true

  - type: checkboxes
    id: tools
    attributes:
      label: 어떤 도구가 쓰였나요 (아는 만큼만)
      description: AI 화면에 표시된 도구 이름입니다. 모르면 전부 비워 두세요
      options:
        - label: "fin_topic (질문 → 확인할 사실·조문 후보)"
        - label: "fin_article (조문 조회)"
        - label: "fin_law_search (법령 검색)"
        - label: "fin_ruling_search (예규·판례·재결 검색)"
        - label: "fin_nts_ruling (국세청 예규 본문)"
        - label: "fin_annex (별표·서식)"
        - label: "fin_verify (인용 검증)"
        - label: "fin_calc (법정 산식 계산)"
        - label: "모르겠습니다"

  - type: dropdown
    id: symptom
    attributes:
      label: 어떤 종류의 문제였나요
      options:
        - "0건 — 있어야 할 자료가 안 나왔습니다"
        - "무관 — 질문과 상관없는 조문·예규가 나왔습니다"
        - "부족 — 나오긴 했는데 근거로 쓰기엔 모자랐습니다"
        - "느림 — 답이 오지 않거나 너무 오래 걸렸습니다"
        - "그 외"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전 (선택)
      description: fin_ping 첫 줄에 나오는 버전입니다
      placeholder: "0.1.0"
